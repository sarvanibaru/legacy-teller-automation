<html>
<head><title>CoreTeller System - Member Search</title></head>
<body bgcolor="#d6d6d6">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <table width="500" align="center" cellpadding="8" cellspacing="0" border="1" bgcolor="#ffffff">
        <tr>
          <td>
            <font face="Tahoma" size="4"><b>Member Search</b></font>
          </td>
        </tr>
        <tr>
          <td>
            {% if not_found %}
            <font color="red">No member matching ID "{{ queried_id }}" was found.</font>
            {% endif %}
            <form method="GET" action="/search">
              <table cellpadding="4" cellspacing="0" border="0">
                <tr>
                  <td><label for="mid">Member ID</label></td>
                  <td><input type="text" id="mid" name="member_id"></td>
                  <td><input type="submit" value="Search"></td>
                </tr>
              </table>
            </form>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
