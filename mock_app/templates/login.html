<html>
<head><title>CoreTeller System - Login</title></head>
<body bgcolor="#d6d6d6">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <table width="400" align="center" cellpadding="8" cellspacing="0" border="1" bgcolor="#ffffff">
        <tr>
          <td>
            <font face="Tahoma" size="4"><b>CoreTeller System</b></font><br>
            <font face="Tahoma" size="2">Internal Use Only</font>
          </td>
        </tr>
        <tr>
          <td>
            {% if error %}
            <font color="red">{{ error }}</font>
            {% endif %}
            <form method="POST" action="/login">
              <table cellpadding="4" cellspacing="0" border="0">
                <tr>
                  <td><label for="f1">Username</label></td>
                  <td><input type="text" id="f1" name="username"></td>
                </tr>
                <tr>
                  <td><label for="f2">Password</label></td>
                  <td><input type="password" id="f2" name="password"></td>
                </tr>
                <tr>
                  <td colspan="2" align="right">
                    <input type="submit" value="Log In">
                  </td>
                </tr>
              </table>
            </form>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
