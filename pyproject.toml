[project]
name = "legacy-teller-automation"
version = "0.1.0"
description = "Computer-use automation system: LLM discovery + deterministic replay for legacy bank UIs"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.45",
    "flask>=3.0",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
