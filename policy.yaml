allowed_origins:
  - "http://localhost:5001"

allowed_path_patterns:
  - "^/login$"
  - "^/search$"
  - "^/member/\\d+$"
  - "^/member/\\d+/sub-account$"
  - "^/member/\\d+/sub-account/confirm$"
  - "^/member/\\d+/sub-account/submit$"

blocked_path_patterns:
  - "^/member/\\d+/close$"

action_risk:
  navigate: safe
  click: safe
  type: safe
  read_text: safe

target_overrides:
  # Path-based: catches a direct navigate straight to the destination.
  - path_pattern: "^/member/\\d+/close$"
    risk: blocked
  - path_pattern: "^/member/\\d+/sub-account/submit$"
    risk: requires_approval
  # Name-based: catches the actual click on the control, regardless of
  # which page it's clicked from. This is what fires in practice, since
  # a click's "current page" is the page BEFORE the click, not the
  # destination the click submits to or navigates toward.
  - action_name: "Close Account"
    risk: blocked
  - action_name: "Confirm and Open Account"
    risk: requires_approval